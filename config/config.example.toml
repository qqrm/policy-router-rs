[defaults]
egress = "direct"

[egress.vpn]
type = "singbox"
endpoint = "socks5://127.0.0.1:1488"

[egress.vpn.process]
enabled = false
program = "sing-box"
args = ["run", "-c", "singbox.json"]
cwd = "."
env = {}
restart = "on-failure"
backoff_ms = 500
max_backoff_ms = 10_000
max_restarts_per_minute = 30

[egress.proxy]
type = "socks5"
endpoint = "socks5://127.0.0.1:1080"

[egress.direct]
type = "direct"

[egress.block]
type = "block"

# You can include external rule lists using "@file:<path>" in app/domain fields.
# Paths are resolved relative to this config file. Include files are line-based:
# - empty lines and lines starting with #, ;, or // are ignored
# - inline comments after # or ; are stripped
# Example:
# app = "@file:lists/vpn_apps.txt"

[[rules]]
egress = "vpn"
app = "zen.exe"

[[rules]]
egress = "vpn"
domain = "chatgpt.com"

[[rules]]
egress = "proxy"
domain = "youtube.com"

[[rules]]
egress = "proxy"
domain = "googlevideo.com"

[[rules]]
egress = "direct"
app = "ciadpi.exe"

[[rules]]
egress = "direct"
domain = ".lan"

[[rules]]
egress = "block"
dst_ip_cidr = "10.0.0.0/24"
